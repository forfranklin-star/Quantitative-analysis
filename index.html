<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本程序已停用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #1a0f00;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 背景 */
  .bg {
    position: fixed; inset: 0;
    background-image: url("https://aka.doubaocdn.com/s/tenWwlOUAm");
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  .overlay {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 30% 50%, rgba(60,25,0,0.45) 0%, transparent 60%),
      radial-gradient(ellipse at 75% 60%, rgba(0,30,60,0.4) 0%, transparent 55%),
      linear-gradient(180deg, rgba(15,8,0,0.35) 0%, rgba(15,8,0,0.15) 40%, rgba(15,8,0,0.5) 100%);
    z-index: 1;
  }

  /* 内容 */
  .content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 24px; gap: 36px;
  }

  .line1 {
    font-size: clamp(30px, 5.2vw, 68px);
    font-weight: 900; letter-spacing: 6px;
    color: #FFD54F;
    text-shadow: 0 0 30px rgba(255,193,7,0.55), 0 0 60px rgba(255,152,0,0.25), 0 3px 12px rgba(0,0,0,0.85);
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 30px rgba(255,193,7,0.55), 0 0 60px rgba(255,152,0,0.25), 0 3px 12px rgba(0,0,0,0.85); }
    50%     { text-shadow: 0 0 40px rgba(255,213,79,0.75), 0 0 80px rgba(255,152,0,0.35), 0 3px 12px rgba(0,0,0,0.85); }
  }

  .link-wrapper {
    position: relative; display: inline-block;
    padding: 16px 28px;
  }
  .evasive-link {
    position: relative;
    font-size: clamp(17px, 2.8vw, 34px);
    font-weight: 700; color: #4DD0E1;
    text-decoration: underline;
    text-decoration-color: rgba(77,208,225,0.5);
    text-underline-offset: 8px;
    text-shadow: 0 0 18px rgba(77,208,225,0.5), 0 2px 8px rgba(0,0,0,0.85);
    cursor: pointer; display: inline-block;
    white-space: nowrap; letter-spacing: 1px;
  }
  .evasive-link:not(.locked) {
    animation: linkGlow 2.5s ease-in-out infinite;
  }
  @keyframes linkGlow {
    0%,100% { text-shadow: 0 0 18px rgba(77,208,225,0.5), 0 2px 8px rgba(0,0,0,0.85); }
    50%     { text-shadow: 0 0 28px rgba(77,208,225,0.75), 0 2px 8px rgba(0,0,0,0.85); }
  }
  .evasive-link.locked {
    color: #69F0AE;
    text-decoration-color: rgba(105,240,174,0.7);
    text-shadow: 0 0 20px rgba(105,240,174,0.6), 0 2px 8px rgba(0,0,0,0.85);
    animation: none;
  }

  /* 字符容器 */
  .char-box { position: relative; display: inline-block; }
  .char-main {
    position: relative; z-index: 2;
    display: inline-block;
    transition: opacity 0.4s ease, color 0.4s ease;
    will-change: transform;
  }
  .char-trail {
    position: absolute; top: 0; left: 0; z-index: 1;
    pointer-events: none;
    display: inline-block;
    will-change: transform;
  }
  .evasive-link.scattered .char-main { opacity: 0.85; color: #fff; }

  /* 提示文字 */
  .hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, calc(-50% + 12px)) scale(0.92);
    font-size: clamp(18px, 3vw, 36px);
    font-weight: 800; letter-spacing: 3px;
    color: #FF80AB;
    text-shadow: 0 0 20px rgba(255,128,171,0.6), 0 0 40px rgba(255,64,129,0.3), 0 2px 8px rgba(0,0,0,0.85);
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1),
                transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 5;
  }
  .hint.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  @media (max-width: 640px) {
    .content { gap: 24px; }
    .line1 { letter-spacing: 3px; }
    .evasive-link { font-size: clamp(13px, 4.5vw, 20px); letter-spacing: 0; }
    .hint { letter-spacing: 1px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="content">
  <div class="line1">本程序已停用，请移步</div>
  <div class="link-wrapper">
    <a href="https://nkyizvm5ktfmmkuuxwdprd.streamlit.app/"
       class="evasive-link" id="evasiveLink"
       target="_blank" rel="noopener noreferrer">https://nkyizvm5ktfmmkuuxwdprd.streamlit.app/</a>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ===== DOM =====
  var link = document.getElementById("evasiveLink");
  var hint = document.getElementById("hint");

  // ===== 常量 =====
  var MAX_DODGES = 4;
  var HINTS = ["这是好玩的", "别当真", "你真想去啊？", "纯数学，不作任何建议哦！"];

  // 速度（比最初版提速 30%）
  var SPEED_MIN = 0.78;
  var SPEED_MAX = 1.95;
  var ROT_MAX   = 1.08;

  // 彗星拖尾：3 层，分别滞后 2/4/6 帧
  var TRAIL_COUNT = 3;
  var TRAIL_LAG   = [2, 4, 6];
  var TRAIL_OPACITY = [0.35, 0.22, 0.12];
  var HISTORY_LEN = 8;

  // ===== 状态机 =====
  var STATE = { IDLE: "idle", SCATTERING: "scattering", RETURNING: "returning", LOCKED: "locked" };
  var state = STATE.IDLE;
  var dodgeCount = 0;

  // ===== 粒子系统 =====
  var particles = [];
  var rafId = null;

  // 构建 DOM：每个字符 = 容器(主字符 + 3层拖尾)
  var rawText = link.textContent;
  link.textContent = "";
  for (var i = 0; i < rawText.length; i++) {
    var ch = rawText[i] === " " ? "\u00A0" : rawText[i];
    var box = document.createElement("span");
    box.className = "char-box";

    var trails = [];
    for (var t = 0; t < TRAIL_COUNT; t++) {
      var tr = document.createElement("span");
      tr.className = "char-trail";
      tr.textContent = ch;
      tr.style.opacity = TRAIL_OPACITY[t];
      box.appendChild(tr);
      trails.push(tr);
    }

    var main = document.createElement("span");
    main.className = "char-main";
    main.textContent = ch;
    box.appendChild(main);

    link.appendChild(box);

    particles.push({
      main: main,
      trails: trails,
      x: 0, y: 0, rot: 0,
      vx: 0, vy: 0, vrot: 0,
      speed: 0, rotSpeed: 0,
      history: []
    });
  }

  // ===== 碰撞边界：整个视口 =====
  function getBounds() {
    var rect = link.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var pad = 16;
    return {
      left: -cx + pad,
      right: window.innerWidth - cx - pad,
      top: -cy + pad,
      bottom: window.innerHeight - cy - pad
    };
  }

  // ===== 初始化粒子：从原位开始，随机初速度 =====
  function initParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var ang = Math.random() * Math.PI * 2;
      var spd = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      p.x = 0; p.y = 0; p.rot = 0;
      p.vx = Math.cos(ang) * spd;
      p.vy = Math.sin(ang) * spd;
      p.vrot = (Math.random() - 0.5) * ROT_MAX * 2;
      p.speed = spd;
      p.rotSpeed = Math.abs(p.vrot);
      p.history = [];
      for (var h = 0; h < HISTORY_LEN; h++) {
        p.history.push({ x: 0, y: 0, rot: 0 });
      }
    }
  }

  function pushHistory(p) {
    p.history.unshift({ x: p.x, y: p.y, rot: p.rot });
    if (p.history.length > HISTORY_LEN) p.history.pop();
  }

  function applyTransform(el, x, y, rot) {
    el.style.transform =
      "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg)";
  }

  function renderParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      applyTransform(p.main, p.x, p.y, p.rot);
      for (var t = 0; t < TRAIL_COUNT; t++) {
        var idx = Math.min(TRAIL_LAG[t], p.history.length - 1);
        var hist = p.history[idx];
        applyTransform(p.trails[t], hist.x, hist.y, hist.rot);
      }
    }
  }

  function resetParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x = 0; p.y = 0; p.rot = 0;
      applyTransform(p.main, 0, 0, 0);
      for (var t = 0; t < TRAIL_COUNT; t++) {
        applyTransform(p.trails[t], 0, 0, 0);
      }
    }
  }

  // ===== 单一动画循环 =====
  function tick() {
    if (state === STATE.SCATTERING) {
      var b = getBounds();
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        if (p.x > b.right)      { p.x = b.right; p.vx = -Math.abs(p.vx); }
        else if (p.x < b.left)  { p.x = b.left;  p.vx =  Math.abs(p.vx); }
        if (p.y > b.bottom)     { p.y = b.bottom; p.vy = -Math.abs(p.vy); }
        else if (p.y < b.top)   { p.y = b.top;    p.vy =  Math.abs(p.vy); }
        pushHistory(p);
      }
      renderParticles();
      rafId = requestAnimationFrame(tick);

    } else if (state === STATE.RETURNING) {
      var allHome = true;
      for (var j = 0; j < particles.length; j++) {
        var q = particles[j];
        var dx = -q.x, dy = -q.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > q.speed) {
          q.x += (dx / dist) * q.speed;
          q.y += (dy / dist) * q.speed;
          allHome = false;
        } else {
          q.x = 0; q.y = 0;
        }
        if (Math.abs(q.rot) > q.rotSpeed) {
          q.rot += (q.rot > 0 ? -1 : 1) * q.rotSpeed;
          allHome = false;
        } else {
          q.rot = 0;
        }
        pushHistory(q);
      }
      renderParticles();
      if (allHome) {
        finishReturn();
      } else {
        rafId = requestAnimationFrame(tick);
      }
    }
  }

  // ===== 状态转换 =====
  function startScatter() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    state = STATE.SCATTERING;
    initParticles();
    link.classList.add("scattered");
    rafId = requestAnimationFrame(tick);
  }

  function startReturn() {
    if (state !== STATE.SCATTERING) return;
    state = STATE.RETURNING;
    // 动画循环已在运行，tick 会自动切换到 returning 逻辑
  }

  function finishReturn() {
    state = STATE.IDLE;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    resetParticles();
    link.classList.remove("scattered");
  }

  function lockLink() {
    state = STATE.LOCKED;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    resetParticles();
    link.classList.remove("scattered");
    link.classList.add("locked");
  }

  // ===== 提示文字 =====
  function showHint(t) {
    hint.textContent = t;
    void hint.offsetWidth; // 强制重排
    hint.classList.add("show");
  }
  function hideHint() {
    hint.classList.remove("show");
  }

  // ===== 核心交互：进入/离开 =====
  function handleEnter() {
    if (state === STATE.LOCKED) return;
    if (state === STATE.SCATTERING) return; // 已在散开，忽略
    if (dodgeCount >= MAX_DODGES) {
      lockLink();
      return;
    }
    dodgeCount++;
    if (dodgeCount <= HINTS.length) showHint(HINTS[dodgeCount - 1]);
    startScatter();
  }

  function handleLeave() {
    if (state === STATE.LOCKED) return;
    hideHint();
    if (state === STATE.SCATTERING) {
      startReturn();
    }
  }

  // 鼠标事件
  link.addEventListener("mouseenter", handleEnter);
  link.addEventListener("mouseleave", handleLeave);

  // 触摸事件（preventDefault 阻止模拟鼠标事件）
  link.addEventListener("touchstart", function (e) {
    e.preventDefault();
    handleEnter();
  }, { passive: false });

  link.addEventListener("touchend", function () {
    setTimeout(handleLeave, 1500);
  });

  // 点击：仅锁定后可跳转
  link.addEventListener("click", function (e) {
    if (state !== STATE.LOCKED) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });

})();
</script>
</body>
</html>
