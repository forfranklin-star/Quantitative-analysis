<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本程序已停用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #1a0f00;
    user-select: none;
    -webkit-user-select: none;
  }

  .bg {
    position: fixed; inset: 0;
    background-image: url("https://aka.doubaocdn.com/s/tenWwlOUAm");
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  .overlay {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 30% 50%, rgba(60,25,0,0.45) 0%, transparent 60%),
      radial-gradient(ellipse at 75% 60%, rgba(0,30,60,0.4) 0%, transparent 55%),
      linear-gradient(180deg, rgba(15,8,0,0.35) 0%, rgba(15,8,0,0.15) 40%, rgba(15,8,0,0.5) 100%);
    z-index: 1;
  }

  .content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 24px; gap: 36px;
  }

  .line1 {
    font-size: clamp(30px, 5.2vw, 68px);
    font-weight: 900; letter-spacing: 6px;
    color: #FFD54F;
    text-shadow: 0 0 30px rgba(255,193,7,0.55), 0 0 60px rgba(255,152,0,0.25), 0 3px 12px rgba(0,0,0,0.85);
    animation: glowPulse 3s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { text-shadow: 0 0 30px rgba(255,193,7,0.55), 0 0 60px rgba(255,152,0,0.25), 0 3px 12px rgba(0,0,0,0.85); }
    50%     { text-shadow: 0 0 40px rgba(255,213,79,0.75), 0 0 80px rgba(255,152,0,0.35), 0 3px 12px rgba(0,0,0,0.85); }
  }

  /* 链接容器：相对定位，容纳遮罩层 */
  .link-wrapper {
    position: relative;
    display: inline-block;
    padding: 16px 28px;
  }

  /* 真正的链接文字：散开后 pointer-events:none，不干扰鼠标 */
  .evasive-link {
    position: relative;
    font-size: clamp(17px, 2.8vw, 34px);
    font-weight: 700; color: #4DD0E1;
    text-decoration: underline;
    text-decoration-color: rgba(77,208,225,0.5);
    text-underline-offset: 8px;
    text-shadow: 0 0 18px rgba(77,208,225,0.5), 0 2px 8px rgba(0,0,0,0.85);
    display: inline-block;
    white-space: nowrap; letter-spacing: 1px;
    pointer-events: none;
    animation: linkGlow 2.5s ease-in-out infinite;
  }
  @keyframes linkGlow {
    0%,100% { text-shadow: 0 0 18px rgba(77,208,225,0.5), 0 2px 8px rgba(0,0,0,0.85); }
    50%     { text-shadow: 0 0 28px rgba(77,208,225,0.75), 0 2px 8px rgba(0,0,0,0.85); }
  }
  .evasive-link.locked {
    color: #69F0AE;
    text-decoration-color: rgba(105,240,174,0.7);
    text-shadow: 0 0 20px rgba(105,240,174,0.6), 0 2px 8px rgba(0,0,0,0.85);
    animation: none;
    pointer-events: auto;
    cursor: pointer;
  }

  /* 透明遮罩层：固定位置，专门接收鼠标事件，不受字符飞散影响 */
  .hover-mask {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    cursor: default;
  }
  .hover-mask.hidden { display: none; }

  .char-box { position: relative; display: inline-block; }
  .char-main {
    position: relative; z-index: 2;
    display: inline-block;
    transition: opacity 0.4s ease, color 0.4s ease;
    will-change: transform;
  }
  .char-trail {
    position: absolute; top: 0; left: 0; z-index: 1;
    pointer-events: none;
    display: inline-block;
    will-change: transform;
  }
  .evasive-link.scattered .char-main { opacity: 0.85; color: #fff; }

  .hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, calc(-50% + 12px)) scale(0.92);
    font-size: clamp(18px, 3vw, 36px);
    font-weight: 800; letter-spacing: 3px;
    color: #FF80AB;
    text-shadow: 0 0 20px rgba(255,128,171,0.6), 0 0 40px rgba(255,64,129,0.3), 0 2px 8px rgba(0,0,0,0.85);
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1),
                transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 5;
  }
  .hint.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  @media (max-width: 640px) {
    .content { gap: 24px; }
    .line1 { letter-spacing: 3px; }
    .evasive-link { font-size: clamp(13px, 4.5vw, 20px); letter-spacing: 0; }
    .hint { letter-spacing: 1px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="content">
  <div class="line1">本程序已停用，请移步</div>
  <div class="link-wrapper" id="linkWrapper">
    <a href="https://nkyizvm5ktfmmkuuxwdprd.streamlit.app/"
       class="evasive-link" id="evasiveLink"
       target="_blank" rel="noopener noreferrer">https://nkyizvm5ktfmmkuuxwdprd.streamlit.app/</a>
    <div class="hover-mask" id="hoverMask"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var link = document.getElementById("evasiveLink");
  var mask = document.getElementById("hoverMask");
  var hint = document.getElementById("hint");

  var MAX_DODGES = 4;
  var HINTS = ["这是好玩的", "别当真", "你真想去啊？", "纯数学，不作任何建议哦！"];

  var SPEED_MIN = 0.78;
  var SPEED_MAX = 1.95;
  var ROT_MAX   = 1.08;

  var TRAIL_COUNT = 3;
  var TRAIL_LAG   = [2, 4, 6];
  var TRAIL_OPACITY = [0.35, 0.22, 0.12];
  var HISTORY_LEN = 8;

  // 状态机
  var S = { IDLE: "idle", FLYING: "flying", HOMING: "homing", LOCKED: "locked" };
  var state = S.IDLE;
  var dodgeCount = 0;
  var rafId = null;

  // 粒子
  var particles = [];
  var rawText = link.textContent;
  link.textContent = "";
  for (var i = 0; i < rawText.length; i++) {
    var ch = rawText[i] === " " ? "\u00A0" : rawText[i];
    var box = document.createElement("span");
    box.className = "char-box";
    var trails = [];
    for (var t = 0; t < TRAIL_COUNT; t++) {
      var tr = document.createElement("span");
      tr.className = "char-trail";
      tr.textContent = ch;
      tr.style.opacity = TRAIL_OPACITY[t];
      box.appendChild(tr);
      trails.push(tr);
    }
    var main = document.createElement("span");
    main.className = "char-main";
    main.textContent = ch;
    box.appendChild(main);
    link.appendChild(box);
    particles.push({
      main: main, trails: trails,
      x: 0, y: 0, rot: 0,
      vx: 0, vy: 0, vrot: 0,
      speed: 0, rotSpeed: 0,
      history: []
    });
  }

  function getBounds() {
    var rect = link.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var pad = 16;
    return {
      left: -cx + pad, right: window.innerWidth - cx - pad,
      top: -cy + pad, bottom: window.innerHeight - cy - pad
    };
  }

  function initParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var ang = Math.random() * Math.PI * 2;
      var spd = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      p.x = 0; p.y = 0; p.rot = 0;
      p.vx = Math.cos(ang) * spd;
      p.vy = Math.sin(ang) * spd;
      p.vrot = (Math.random() - 0.5) * ROT_MAX * 2;
      p.speed = spd;
      p.rotSpeed = Math.abs(p.vrot);
      p.history = [];
      for (var h = 0; h < HISTORY_LEN; h++) p.history.push({ x: 0, y: 0, rot: 0 });
    }
  }

  function pushHist(p) {
    p.history.unshift({ x: p.x, y: p.y, rot: p.rot });
    if (p.history.length > HISTORY_LEN) p.history.pop();
  }

  function setT(el, x, y, r) {
    el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + r.toFixed(1) + "deg)";
  }

  function render() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      setT(p.main, p.x, p.y, p.rot);
      for (var t = 0; t < TRAIL_COUNT; t++) {
        var idx = Math.min(TRAIL_LAG[t], p.history.length - 1);
        setT(p.trails[t], p.history[idx].x, p.history[idx].y, p.history[idx].rot);
      }
    }
  }

  function resetPos() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x = 0; p.y = 0; p.rot = 0;
      setT(p.main, 0, 0, 0);
      for (var t = 0; t < TRAIL_COUNT; t++) setT(p.trails[t], 0, 0, 0);
    }
  }

  // 单一动画循环
  function tick() {
    if (state === S.FLYING) {
      var b = getBounds();
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
        if (p.x > b.right) { p.x = b.right; p.vx = -Math.abs(p.vx); }
        else if (p.x < b.left) { p.x = b.left; p.vx = Math.abs(p.vx); }
        if (p.y > b.bottom) { p.y = b.bottom; p.vy = -Math.abs(p.vy); }
        else if (p.y < b.top) { p.y = b.top; p.vy = Math.abs(p.vy); }
        pushHist(p);
      }
      render();
      rafId = requestAnimationFrame(tick);
    } else if (state === S.HOMING) {
      var done = true;
      for (var j = 0; j < particles.length; j++) {
        var q = particles[j];
        var dx = -q.x, dy = -q.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > q.speed) {
          q.x += (dx / dist) * q.speed;
          q.y += (dy / dist) * q.speed;
          done = false;
        } else { q.x = 0; q.y = 0; }
        if (Math.abs(q.rot) > q.rotSpeed) {
          q.rot += (q.rot > 0 ? -1 : 1) * q.rotSpeed;
          done = false;
        } else { q.rot = 0; }
        pushHist(q);
      }
      render();
      if (done) { doHome(); }
      else { rafId = requestAnimationFrame(tick); }
    }
  }

  function fly() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    state = S.FLYING;
    initParticles();
    link.classList.add("scattered");
    rafId = requestAnimationFrame(tick);
  }

  function home() {
    if (state !== S.FLYING) return;
    state = S.HOMING;
  }

  function doHome() {
    state = S.IDLE;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    resetPos();
    link.classList.remove("scattered");
  }

  function lock() {
    state = S.LOCKED;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    resetPos();
    link.classList.remove("scattered");
    link.classList.add("locked");
    mask.classList.add("hidden");
  }

  function showHint(t) { hint.textContent = t; void hint.offsetWidth; hint.classList.add("show"); }
  function hideHint() { hint.classList.remove("show"); }

  // ===== 核心：遮罩层接收鼠标事件，完全隔离字符飞散的影响 =====
  mask.addEventListener("mouseenter", function () {
    if (state === S.LOCKED || state === S.FLYING) return;
    if (dodgeCount >= MAX_DODGES) { lock(); return; }
    dodgeCount++;
    if (dodgeCount <= HINTS.length) showHint(HINTS[dodgeCount - 1]);
    fly();
  });

  mask.addEventListener("mouseleave", function () {
    if (state === S.LOCKED) return;
    hideHint();
    if (state === S.FLYING) home();
  });

  // 触摸设备
  mask.addEventListener("touchstart", function (e) {
    e.preventDefault();
    if (state === S.LOCKED || state === S.FLYING) return;
    if (dodgeCount >= MAX_DODGES) { lock(); return; }
    dodgeCount++;
    if (dodgeCount <= HINTS.length) showHint(HINTS[dodgeCount - 1]);
    fly();
  }, { passive: false });

  mask.addEventListener("touchend", function () {
    if (state === S.LOCKED) return;
    setTimeout(function () { hideHint(); if (state === S.FLYING) home(); }, 1500);
  });

  // 锁定后链接可点击
  link.addEventListener("click", function (e) {
    if (state !== S.LOCKED) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });

})();
</script>
</body>
</html>
